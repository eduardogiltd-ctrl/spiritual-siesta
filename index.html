<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siesta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Spiritual Siesta</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --white:#f5f4f1;
    --dim:rgba(245,244,241,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:#000;color:var(--white);
    font-family:var(--sans);font-weight:300;
    -webkit-font-smoothing:antialiased;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .screen{
    position:fixed;inset:0;overflow:hidden;
    opacity:0;pointer-events:none;transition:opacity 1.6s ease;
  }
  .screen.on{opacity:1;pointer-events:auto}

  /* ---------- INICIO: toda la pantalla es el botón ---------- */
  #home{background:#000}
  .start{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  }
  .num{font-size:72px;font-weight:200;line-height:1;letter-spacing:-.01em}
  .count{font-size:13px;color:var(--dim);min-height:1.2em}
  .foot{
    position:absolute;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:28px;
  }
  .link{padding:8px;font-size:13px;color:var(--dim)}

  /* ---------- HOJAS ---------- */
  .scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .4s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:520px;margin:0 auto;
    background:#111;padding:32px 28px max(28px,env(safe-area-inset-bottom));
    max-height:86dvh;overflow-y:auto;
    transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.on{transform:none}
  .sheet ol{padding-left:20px;font-size:15px;line-height:1.9;color:var(--dim)}
  .settings{display:flex;flex-direction:column;gap:28px}
  .row{display:flex;flex-direction:column;gap:10px}
  .label{font-size:13px;color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px 20px}
  .chips button{padding:4px 0;font-size:17px;color:var(--dim);transition:color .3s}
  .chips button.on{color:var(--white)}
  .hint{font-size:13px;line-height:1.5;color:var(--dim);max-height:0;overflow:hidden;opacity:0;transition:max-height .4s,opacity .4s}
  .hint.on{max-height:80px;opacity:1}
  .demo{display:block;margin-top:32px;padding:4px 0;font-size:13px;color:var(--dim)}

  /* ---------- SIESTA: un punto ---------- */
  #session{background:#000}
  .orb-wrap{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;transition:opacity 8s ease}
  .orb-wrap.dim{opacity:.1}
  .orb{width:100%;height:100%;border-radius:50%;background:var(--white);animation:breathe 10s ease-in-out infinite}
  /* 4 s inspirar · 6 s espirar ≈ 6 respiraciones por minuto */
  @keyframes breathe{0%,100%{transform:scale(.25)}40%{transform:scale(1)}}
  .caption{
    position:absolute;left:32px;right:32px;top:calc(50% + 72px);
    max-width:340px;margin:0 auto;text-align:center;
    font-size:17px;line-height:1.45;color:rgba(245,244,241,.72);
    opacity:0;transition:opacity .9s ease;
  }
  .caption.show{opacity:1}
  .stop,.time{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);opacity:0;pointer-events:none;transition:opacity .8s}
  .stop{bottom:max(24px,env(safe-area-inset-bottom));padding:8px}
  .time{top:max(32px,env(safe-area-inset-top));font-variant-numeric:tabular-nums}
  .stop.show{opacity:1;pointer-events:auto}
  .time.show{opacity:1}

  /* ---------- DESPERTAR: el punto crece hasta ser la luz ---------- */
  #wake{color:#000}
  .sun{
    position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax;
    border-radius:50%;background:var(--white);
    transform:scale(.01);transition:transform 0s 1.6s;
  }
  body.dawn .sun{transform:scale(1);transition:transform 11s cubic-bezier(.55,0,.35,1)}
  .wake-ui{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    opacity:0;transition:opacity 0s;
  }
  body.dawn .wake-ui{opacity:1;transition:opacity 2s 8s}
  .back{font-size:34px;font-weight:200}
  #wake .count{color:rgba(0,0,0,.45)}
  .pill{position:absolute;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));padding:8px;font-size:13px;color:rgba(0,0,0,.55)}

  @media (prefers-reduced-motion:reduce){.orb{animation-duration:20s}}
</style>
</head>
<body>

<!-- INICIO -->
<section id="home" class="screen on">
  <button id="start" class="start" aria-label="Empezar siesta de 11 minutos">
    <span class="num">11</span>
    <span class="count" id="count"></span>
  </button>
  <div class="foot">
    <button id="open-settings" class="link">ajustes</button>
    <button id="open-install" class="link" hidden>instalar</button>
  </div>
</section>

<div id="scrim" class="scrim"></div>

<!-- AJUSTES -->
<aside id="sheet-settings" class="sheet">
  <div class="settings">
    <div class="row">
      <span class="label">fondo</span>
      <div class="chips" data-key="ambient">
        <button data-v="none">silencio</button>
        <button data-v="rosa">ruido rosa</button>
        <button data-v="mar">mar de fondo</button>
        <button data-v="olas">olas</button>
        <button data-v="theta">theta 5 Hz</button>
      </div>
      <p class="hint" id="hint-theta">Con auriculares. Cada oído recibe un tono distinto y el cerebro percibe un pulso lento de 5&nbsp;Hz que no se oye como nota.</p>
    </div>
    <div class="row">
      <span class="label">despertar</span>
      <div class="chips" data-key="wake">
        <button data-v="cuenco">cuenco</button>
        <button data-v="gong">gong</button>
        <button data-v="campanilla">campanilla</button>
      </div>
    </div>
    <div class="row">
      <span class="label">voz</span>
      <div class="chips" data-key="voice">
        <button data-v="on">con voz</button>
        <button data-v="off">sin voz</button>
      </div>
    </div>
  </div>

  <button id="demo" class="demo">prueba rápida · 90 s</button>
</aside>

<!-- INSTALAR EN IPHONE -->
<aside id="sheet-install" class="sheet">
  <ol>
    <li>Pulsa Compartir en Safari.</li>
    <li>Elige «Añadir a pantalla de inicio».</li>
    <li>Abre Siesta desde su icono.</li>
  </ol>
</aside>

<!-- SIESTA -->
<section id="session" class="screen">
  <p class="time" id="time">11:00</p>
  <div class="orb-wrap" id="orb-wrap"><div class="orb"></div></div>
  <p class="caption" id="caption"></p>
  <button id="stop" class="stop">terminar</button>
</section>

<!-- DESPERTAR -->
<section id="wake" class="screen">
  <div class="sun"></div>
  <div class="wake-ui">
    <h2 class="back">De vuelta.</h2>
    <p class="count" id="wake-count"></p>
    <button id="return" class="pill">volver al día</button>
  </div>
</section>

<script>
/* =========================================================
   Ajustes
   ========================================================= */
const S = Object.assign(
  { ambient: 'olas', wake: 'cuenco', voice: 'on' },
  JSON.parse(localStorage.getItem('ss_settings') || '{}')
);
const saveSettings = () => localStorage.setItem('ss_settings', JSON.stringify(S));

const FULL = 660;   // 11 min
const DEMO = 90;

/* Guion de bienvenida: [frase, pausa después en ms] */
const INTRO = [
  ['Hola.', 900],
  ['Te doy la bienvenida a tu siesta.', 1500],
  ['Durante los próximos once minutos, no tienes que hacer nada.', 1700],
  ['No importa lo que tengas pendiente.', 900],
  ['No importa la hora que sea.', 1500],
  ['Este tiempo es tuyo.', 2600],
  ['Busca una postura cómoda… y cierra los ojos.', 2800],
  ['Respira hondo…', 3200],
  ['…y suelta el aire, despacio.', 3400],
  ['Otra vez.', 3800],
  ['Deja que los hombros caigan.', 2400],
  ['Si te duermes, bien. Si no, también.', 1700],
  ['Solo descansa.', 1500],
  ['Yo te aviso cuando acabe.', 0],
];

/* =========================================================
   Motor de audio
   ========================================================= */
let ctx, master, reverb, buffers;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp).connect(ctx.destination);

    reverb = ctx.createConvolver();
    reverb.buffer = impulse(4);
    const wet = ctx.createGain(); wet.gain.value = 0.32;
    reverb.connect(wet).connect(master);

    buffers = { pink: noiseBuffer('pink'), brown: noiseBuffer('brown') };
  }
  if (ctx.state === 'suspended') ctx.resume();
}

function impulse(sec) {
  const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return b;
}

/* Ruido en bucle sin costura: se generan unos samples extra y se
   funden con el principio para que el final enlace con el inicio. */
function noiseBuffer(type, seconds = 12) {
  const sr = ctx.sampleRate, len = sr * seconds, fade = Math.floor(sr * 0.5);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const g = new Float32Array(len + fade);
    if (type === 'pink') {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < g.length; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        g[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else {
      let last = 0;
      for (let i = 0; i < g.length; i++) {
        last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
        g[i] = last * 3.5;
      }
    }
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = g[i];
    for (let i = 0; i < fade; i++) {
      const t = i / fade;
      d[i] = g[i] * Math.sqrt(t) + g[len + i] * Math.sqrt(1 - t);
    }
  }
  return buf;
}

function gain(v) { const g = ctx.createGain(); g.gain.value = v; return g; }
function lowpass(f, q = 0.7) { const b = ctx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.value = f; b.Q.value = q; return b; }
function osc(f, type = 'sine') { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return o; }

/* Fondos sonoros. Devuelve un objeto con stop(t). */
function buildAmbient(type, bus) {
  const nodes = [];
  const loop = buf => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; nodes.push(s); return s; };

  if (type === 'rosa') {
    loop(buffers.pink).connect(lowpass(5000)).connect(gain(0.28)).connect(bus);
  }
  if (type === 'mar') {
    loop(buffers.brown).connect(lowpass(700)).connect(gain(0.55)).connect(bus);
  }
  if (type === 'olas') {
    // ruido rosa con filtro y volumen que suben y bajan cada ~12 s
    const lp = lowpass(600, 0.5), g = gain(0.25), lfo = osc(0.08);
    lfo.connect(gain(450)).connect(lp.frequency);
    lfo.connect(gain(0.18)).connect(g.gain);
    nodes.push(lfo);
    loop(buffers.pink).connect(lp).connect(g).connect(bus);
  }
  if (type === 'theta') {
    // pulso binaural: 200 Hz izquierda, 205 Hz derecha → 5 Hz percibidos
    const merger = ctx.createChannelMerger(2);
    const L = osc(200), R = osc(205);
    L.connect(merger, 0, 0); R.connect(merger, 0, 1);
    nodes.push(L, R);
    merger.connect(gain(0.07)).connect(bus);
    loop(buffers.brown).connect(lowpass(500)).connect(gain(0.18)).connect(bus);
  }

  nodes.forEach(n => n.start());
  return { stop(t) { nodes.forEach(n => { try { n.stop(t); } catch (e) {} }); } };
}

/* Sonidos de campana por síntesis aditiva. Cada parcial va duplicado
   y ligeramente desafinado para el batido típico de un cuenco. */
const BELLS = {
  cuenco:     { f: 196, level: .34, attack: .015, noise: 0,
                partials: [[1, 1, 14], [2.76, .45, 9], [5.4, .22, 6], [8.9, .1, 4]] },
  gong:       { f: 82,  level: .2,  attack: .05,  noise: .25,
                partials: [[1, 1, 18], [1.52, .6, 14], [2.18, .5, 11], [2.93, .35, 9], [3.8, .25, 7], [5.1, .15, 5]] },
  campanilla: { f: 880, level: .22, attack: .004, noise: 0,
                partials: [[1, 1, 5], [2, .3, 3], [3, .2, 2], [4.2, .12, 1.5]] },
};

function strike(kind, when, vol, dest) {
  const p = BELLS[kind];
  const out = gain(vol * p.level);
  out.connect(dest);
  p.partials.forEach(([ratio, amp, decay]) => {
    [-1, 1].forEach(side => {
      const o = osc(p.f * ratio * (side > 0 ? 1.0035 : 1));
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(amp * 0.5, when + p.attack);
      g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
      let chain = o.connect(g);
      if (ctx.createStereoPanner) { const pan = ctx.createStereoPanner(); pan.pan.value = side * 0.35; chain = chain.connect(pan); }
      chain.connect(out);
      o.start(when); o.stop(when + decay + 0.1);
    });
  });
  if (p.noise) {
    const s = ctx.createBufferSource(); s.buffer = buffers.pink;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = .7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(p.noise, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.2);
    s.connect(bp).connect(g).connect(out);
    s.start(when, Math.random() * 5); s.stop(when + 1.3);
  }
}

function makeEndBus() {
  const b = gain(1);
  b.connect(master); b.connect(reverb);
  return b;
}

/* Despertar: tres toques que crecen, nunca una alarma de golpe */
function scheduleWake(kind, t0, bus) {
  const gaps = kind === 'campanilla' ? [0, 4, 8] : [0, 7, 14];
  const vols = [0.45, 0.7, 1];
  gaps.forEach((g, i) => strike(kind, t0 + g, vols[i], bus));
}

/* =========================================================
   Voz
   1º intenta la locución en voz/01.wav, voz/02.wav… (una por frase
      de INTRO; basta con sustituir esos archivos por la grabación real)
   2º si no hay archivo, usa una voz española del sistema
   3º si no hay voz española, solo subtítulos: nunca una voz extranjera
   ========================================================= */
const voicesReady = new Promise(res => {
  if (!('speechSynthesis' in window) || speechSynthesis.getVoices().length) return res();
  speechSynthesis.onvoiceschanged = () => res();
  setTimeout(res, 1500);
});

function pickVoice() {
  const es = speechSynthesis.getVoices().filter(v => /^es[-_]/i.test(v.lang));
  for (const n of ['Mónica', 'Monica', 'Marisol', 'Jorge', 'Paulina', 'Google español']) {
    const v = es.find(v => v.name.startsWith(n));
    if (v) return v;
  }
  return es.find(v => /es[-_]ES/i.test(v.lang)) || es[0] || null;
}

/* La locución pasa por Web Audio: iOS bloquea Audio.play() fuera de un
   toque del usuario, y el AudioContext ya queda abierto al pulsar Empezar */
const voiceBuffers = {};
function loadVoice(src) {
  return voiceBuffers[src] ??= fetch(src)
    .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(b => ctx.decodeAudioData(b))
    .catch(() => null);
}

let voiceEl = null;
async function playFile(src) {
  const buf = await loadVoice(src);
  if (!buf) return false;
  return new Promise(res => {
    const s = voiceEl = ctx.createBufferSource();
    s.buffer = buf;
    s.connect(gain(0.95)).connect(master);
    s.onended = () => res(true);
    s.start();
  });
}

function stopVoice() {
  window.speechSynthesis?.cancel();
  if (voiceEl) { try { voiceEl.stop(); } catch (e) {} voiceEl = null; }
}

async function say(text, i) {
  const silent = () => wait(700 + text.length * 70);
  if (S.voice !== 'on') return silent();
  if (i != null && await playFile(`voz/${String(i + 1).padStart(2, '0')}.wav`)) return;
  if (!('speechSynthesis' in window)) return silent();
  await voicesReady;
  const v = pickVoice();
  if (!v) return silent();
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang;
    u.rate = 0.85; u.pitch = 0.95; u.volume = 0.9;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
    setTimeout(res, 2500 + text.length * 130); // por si el navegador no dispara onend
  });
}

/* =========================================================
   Pantallas y sesión
   ========================================================= */
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { s = Math.ceil(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

let session = null, preview = null, lock = null;

function setCaption(t) {
  const c = $('caption');
  c.classList.remove('show');
  setTimeout(() => { c.textContent = t; if (t) c.classList.add('show'); }, 450);
}

let timeTimer;
function flashTime(ms = 3500) {
  const ui = [$('time'), $('stop')];
  ui.forEach(el => el.classList.add('show'));
  clearTimeout(timeTimer);
  timeTimer = setTimeout(() => ui.forEach(el => el.classList.remove('show')), ms);
}

async function startSession(total) {
  ensureCtx();
  stopPreview();
  const now = ctx.currentTime, t0 = now + total;

  const ambBus = gain(0); ambBus.connect(master);
  const fadeOut = Math.min(40, total * 0.25);
  ambBus.gain.setValueAtTime(0, now);
  ambBus.gain.linearRampToValueAtTime(1, now + 8);
  ambBus.gain.setValueAtTime(1, t0 - fadeOut);
  ambBus.gain.linearRampToValueAtTime(0, t0 - 2);
  const amb = buildAmbient(S.ambient, ambBus);
  amb.stop(t0 + 1);

  const endBus = makeEndBus();
  strike(S.wake, now + 0.3, 0.3, endBus);   // toque suave de entrada
  scheduleWake(S.wake, t0, endBus);

  session = { t0, ambBus, amb, endBus, done: false };
  $('orb-wrap').classList.remove('dim');
  $('caption').textContent = ''; $('caption').classList.remove('show');
  show('session');
  flashTime(4000);
  try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  runIntro(session);
  tick();
}

async function runIntro(s) {
  await wait(3500);
  for (const [i, [line, pause]] of INTRO.entries()) {
    if (session !== s) return;
    setCaption(line);
    await say(line, i);
    if (session !== s) return;
    await wait(pause);
  }
  await wait(2500);
  if (session !== s) return;
  setCaption('');
  $('orb-wrap').classList.add('dim');
}

function tick() {
  if (!session || session.done) return;
  const rem = Math.max(0, session.t0 - ctx.currentTime);
  $('time').textContent = fmt(rem);
  if (rem <= 0) return finish();
  requestAnimationFrame(tick);
}
// respaldo por si la pestaña pasa a segundo plano y se congela requestAnimationFrame
setInterval(() => { if (session && !session.done && ctx.currentTime >= session.t0) finish(); }, 1000);

function finish() {
  session.done = true;
  const d = recordNap();
  $('wake-count').textContent = `Siesta nº ${d.n}` + (d.streak > 1 ? ` · ${d.streak} días seguidos` : '');
  document.body.classList.add('dawn');
  show('wake');
}

function endSession() {
  if (!session) return;
  stopVoice();
  const n = ctx.currentTime;
  [session.ambBus, session.endBus].forEach(b => {
    b.gain.cancelScheduledValues(n);
    b.gain.setValueAtTime(b.gain.value, n);
    b.gain.linearRampToValueAtTime(0, n + 2);
  });
  session.amb.stop(n + 2.2);
  const bus = session.endBus;
  setTimeout(() => bus.disconnect(), 2500);
  session = null;
  lock?.release?.(); lock = null;
  document.body.classList.remove('dawn');
  renderCount();
  show('home');
}

/* Hábito */
function recordNap() {
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - 864e5).toDateString();
  const d = JSON.parse(localStorage.getItem('ss_log') || '{"n":0,"streak":0,"last":null}');
  if (d.last !== today) { d.streak = d.last === yesterday ? d.streak + 1 : 1; d.last = today; }
  d.n++;
  localStorage.setItem('ss_log', JSON.stringify(d));
  return d;
}
function renderCount() {
  const d = JSON.parse(localStorage.getItem('ss_log') || '{"n":0}');
  $('count').textContent = d.n ? '' : 'toca para empezar';
}

/* Previsualizar sonidos desde los ajustes */
function previewAmbient(type) {
  ensureCtx(); stopPreview();
  if (type === 'none') return;
  const bus = gain(0); bus.connect(master);
  const n = ctx.currentTime;
  bus.gain.setValueAtTime(0, n);
  bus.gain.linearRampToValueAtTime(1, n + 1);
  bus.gain.setValueAtTime(1, n + 4.5);
  bus.gain.linearRampToValueAtTime(0, n + 6);
  const a = buildAmbient(type, bus);
  a.stop(n + 6.1);
  preview = { bus, a };
}
function stopPreview() {
  if (!preview) return;
  const n = ctx.currentTime;
  preview.bus.gain.cancelScheduledValues(n);
  preview.bus.gain.setTargetAtTime(0, n, 0.1);
  preview.a.stop(n + 0.6);
  preview = null;
}
function previewWake(kind) {
  ensureCtx(); stopPreview();
  const bus = makeEndBus();
  strike(kind, ctx.currentTime + 0.05, 0.8, bus);
}

/* =========================================================
   UI
   ========================================================= */
function renderChips() {
  document.querySelectorAll('.chips').forEach(group => {
    group.querySelectorAll('button').forEach(b => b.classList.toggle('on', S[group.dataset.key] === b.dataset.v));
  });
  $('hint-theta').classList.toggle('on', S.ambient === 'theta');
}

document.querySelectorAll('.chips').forEach(group => {
  group.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const key = group.dataset.key;
    S[key] = b.dataset.v; saveSettings(); renderChips();
    if (key === 'ambient') previewAmbient(S.ambient);
    if (key === 'wake') previewWake(S.wake);
    if (key === 'voice' && S.voice === 'on') { ensureCtx(); stopVoice(); say(INTRO[5][0], 5); }
  });
});

$('start').onclick = () => startSession(FULL);
$('demo').onclick = () => { closeSheets(); startSession(DEMO); };
$('stop').onclick = e => { e.stopPropagation(); endSession(); };
$('session').onclick = () => flashTime();
$('return').onclick = endSession;

/* Hojas */
function openSheet(id) { $(id).classList.add('on'); $('scrim').classList.add('on'); }
function closeSheets() {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
  $('scrim').classList.remove('on');
}
$('open-settings').onclick = () => openSheet('sheet-settings');
$('scrim').onclick = closeSheets;

/* Instalación */
const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let installPrompt = null;
if (!installed && isIOS) $('open-install').hidden = false;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  $('open-install').hidden = false;
});
addEventListener('appinstalled', () => { $('open-install').hidden = true; });
$('open-install').onclick = () => {
  if (installPrompt) installPrompt.prompt();
  else openSheet('sheet-install');
};

/* Al volver a la app durante una siesta, recuperar audio y pantalla activa */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !session || session.done) return;
  ctx.resume();
  try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {}
});

if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

renderChips();
renderCount();
</script>
